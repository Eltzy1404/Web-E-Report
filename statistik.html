<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <!-- Menggunakan CDN Bootstrap (Online) agar langsung jalan -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white  fw-bold ">E-report <span class="brand-light">Santri</span> </span>
            <div class="admin-profile">
                <div>
                    <span>Admin</span>
                    <small>Pengelola Sistem</small>
                </div>
                <div class="admin-avatar">AD</div>
            </div>
    </nav>
    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5>Menu</h5>
            <a href="dashboard.html" class="menu-link"><i class="bi bi-bar-chart"></i>Dashboard</a>
            <a href="statistik.html" class="menu-link active"><i class="bi bi-clipboard2-data"></i>Data Laporan</a>
            <a href="settings.html" class="menu-link"><i class="bi bi-gear-wide"></i>Setting</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan Statistik</h2>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <h5>Statisik Laporan</h5>
                            <p>Statisik Laporan</p>
                            <div class="area-grafik">
                                <canvas id="santriChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>Status Laporan</h5>
                            <p>Laporan santri</p>
                            <div class="area-grafik">
                                <canvas id="laporanChart" style="height: 300px;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
           
        </main>
    </div>


    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    const ctx = document.getElementById('santriChart')

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ["Januari","Februari","Maret","April","Mei"],
                datasets: [{
                    label : "Jumlah laporan perbulan",
                    data: [10,14,7,9,2],
                    backgroundColor:[
                        "royalblue",
                        "red",
                        "yellow",
                        "green",
                        "indigo"
                    ],
                    borderWidth: 3
                }]
            },
            options:{
                plugins: {
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })

    const cts = document.getElementById('laporanChart')

        new Chart(cts, {
            type: 'doughnut',
            data: {
                labels: ["Accepted","Rejected","Pending"],
                datasets: [{
                    label : "Jumlah laporan perbulan",
                    data: [10,14,7],
                    backgroundColor:[
                        "royalblue",
                        "red",
                        "yellow",
                    ],
                    borderWidth: 3
                }]
            },
            options:{
                plugins: {
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })
    </script>
    

</body>
</html>
